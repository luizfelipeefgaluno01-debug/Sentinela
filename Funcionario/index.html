<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eaf3ff"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><title>Cadastro de equipe | Hospital Infantil Aurora</title><link rel="stylesheet" href="styles.css?v=4"></head>
<body><main class="page-shell"><header class="page-header"><div><a class="hospital-brand" href="../02-login/index.html"><img src="../assets/favicon.svg" alt=""><span>Hospital Infantil Aurora</span></a><p class="eyebrow">Administração • Equipe</p><h1>Cadastro de funcionário</h1><p class="subtitle">Dados profissionais e de acesso institucional.</p></div><a class="text-link" href="../02-login/index.html">Sair</a></header>
<form class="employee-form"><section class="form-section"><div class="section-heading"><span class="step">01</span><div><h2>Identificação</h2><p>Dados pessoais do profissional.</p></div></div><div class="fields"><label>Nome completo<input name="full-name" autocomplete="name" required></label><label>Nome social<input name="social-name"></label><label>CPF<input name="cpf" inputmode="numeric" required></label><label>Data de nascimento<input name="birth-date" type="date"></label><label>Telefone<input name="phone" type="tel" autocomplete="tel"></label><label>E-mail institucional<input name="email" type="email" autocomplete="email" required></label></div></section>
<section class="form-section"><div class="section-heading"><span class="step step-pink">02</span><div><h2>Vínculo profissional</h2><p>Informações funcionais e permissões do perfil.</p></div></div><div class="fields"><label>Categoria profissional<select name="profession"><option value="">Selecione</option><option>Medicina</option><option>Enfermagem</option><option>Recepção</option><option>Administração</option><option>Outro</option></select></label><label>Registro profissional<input name="registration" placeholder="Conselho e número, se aplicável"></label><label>Setor<input name="department" placeholder="Ex.: Pediatria"></label><label>Unidade<select name="unit"><option value="">Selecione</option><option>Pronto atendimento</option><option>Internação</option><option>Ambulatório</option><option>Administrativo</option></select></label><label>Identificação funcional<input name="employee-id"></label><label>Perfil de acesso<select name="access"><option value="">Selecione</option><option>Assistencial</option><option>Recepção</option><option>Administrativo</option></select></label><label>Data de admissão<input name="start-date" type="date"></label><label>Situação<select name="status"><option>Ativo</option><option>Inativo</option></select></label></div></section>
<div class="form-actions"><button class="button button-secondary" type="reset">Limpar</button><a class="button button-primary" href="../08-painel-medico/index.html">Salvar funcionário</a></div></form></main></body></html>
